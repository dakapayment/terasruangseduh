      if (!phone) return '';
      let str = String(phone).replace(/[^0-9]/g, '');
      if (str.startsWith('62')) {

      } else if (!str.startsWith('0') && str.length > 0) {
        str = '0' + str;
      }
      return str;
    };

    const getISODateStr = (d) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getLocalDateStr = (dateInput) => {
      if (!dateInput) return '';
      if (typeof dateInput === 'string') {
        const trimmed = dateInput.trim();
        const isoMatch = trimmed.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
        if (isoMatch) {
          return `${isoMatch[1]}-${String(isoMatch[2]).padStart(2, '0')}-${String(isoMatch[3]).padStart(2, '0')}`;
        }
        const dmyMatch = trimmed.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
        if (dmyMatch) {
          return `${dmyMatch[3]}-${String(dmyMatch[2]).padStart(2, '0')}-${String(dmyMatch[1]).padStart(2, '0')}`;
        }
      }
      const d = new Date(dateInput);
      if (!isNaN(d.getTime())) {
        return getISODateStr(d);
      }
      return String(dateInput).slice(0, 10);
    };

      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {}
    };

                            className="text-[#1565c0] bg-white px-2.5 py-1 rounded-lg border border-blue-300 font-bold text-[11px] shadow-sm hover:bg-blue-50 transition"
                          >
                            {showVoucherSelector ? 'Tutup Stok' : `Pilih dari Stok Saya (${userVouchers.length})`}
                          </button>
                        </div>

                        {selectedVoucher ? (
                          <div className="flex justify-between items-center bg-white p-2.5 rounded-xl border border-[#1565c0] shadow-sm">
                            <div className="flex items-center gap-2">
                              <div className="w-8 h-8 rounded-lg bg-blue-100 text-[#1565c0] flex items-center justify-center font-bold">
                                <Ticket className="w-4 h-4" />
                              </div>
                              <div>
                                <p className="text-xs font-bold text-slate-800">{selectedVoucher.name}</p>
                                <span className="text-[10px] text-[#1565c0] font-black">-Rp {discountAmount.toLocaleString('id-ID')}</span>
                              </div>
                            </div>
                            <button onClick={() => setSelectedVoucher(null)} className="text-rose-500 text-[10px] font-bold bg-rose-50 px-2.5 py-1.5 rounded-lg hover:bg-rose-100">Batal</button>
                          </div>
                        ) : (
                          <div className="flex gap-2">
                            <input 
                              type="text" 
                              value={promoInput} 
                              onChange={(e) => setPromoInput(e.target.value)} 
                              placeholder="MASUKKAN KODE PROMO" 
                              className="flex-1 bg-white border p-2.5 rounded-xl text-xs font-mono uppercase outline-none focus:ring-2 focus:ring-[#1565c0]"
                            />
                            <button onClick={() => {
                              const match = promosList.find(p => p.code.toUpperCase() === promoInput.trim().toUpperCase());
                              if (!match) return showToast('Kode promo tidak ditemukan', 'error');
                              setSelectedVoucher({ id: `p_${Date.now()}`, name: match.title, code: match.code, discountAmount: match.discountAmount, discountPercent: match.discountPercent, type: match.type, isManualPromo: true });
                              setPromoInput('');
                              showToast(`Promo ${match.code} aktif!`);
                            }} className="bg-[#1565c0] text-white font-bold text-xs px-4 rounded-xl shadow">Gunakan</button>
                          </div>
                        )}

                        {showVoucherSelector && (
                          <div className="pt-2 border-t border-blue-500/20 space-y-2">
                            <div className="flex items-center justify-between text-[11px] font-semibold text-slate-600">
                              <span>Voucher Tersedia di Akun:</span>
                              <span className="font-bold text-[#1565c0]">{userVouchers.length} Tersedia</span>
                            </div>

                            {!currentUser ? (
                              <div className="bg-white p-3 rounded-xl border border-dashed border-blue-300 text-center space-y-2">
                                <p className="text-[11px] text-slate-500">Silakan login untuk menggunakan voucher Anda.</p>
                                <button
                                  type="button"
                                  onClick={() => { setIsLoginModalOpen(true); setIsCartOpen(false); }}
                                  className="bg-[#1565c0] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow"
                                >
                                  Login Akun Sekarang
                                </button>
                              </div>
                            ) : userVouchers.length === 0 ? (
                              <div className="bg-white p-3 rounded-xl border border-dashed border-slate-200 text-center space-y-2">
                                <p className="text-[11px] text-slate-400 italic">Belum ada voucher aktif di akun Anda.</p>
                                <button
                                  type="button"
                                  onClick={() => { setCurrentTab('reward'); setIsCartOpen(false); }}
                                  className="text-[11px] font-bold text-[#1565c0] hover:underline"
                                >
                                  Tukarkan Poin di Menu Reward &gt;
                                </button>
                              </div>
                            ) : (
                              <div className="max-h-44 overflow-y-auto space-y-2 scrollbar-none pr-0.5">
                                {userVouchers.map((v, idx) => {
                                  const isCurrentSelected = selectedVoucher && selectedVoucher.id === v.id;
                                  return (
                                    <div
                                      key={v.id || idx}
                                      className={`p-2.5 rounded-xl border transition flex items-center justify-between gap-2 ${
                                        isCurrentSelected
                                          ? 'bg-blue-50 border-[#1565c0] shadow-sm'
                                          : 'bg-white border-slate-200 hover:border-[#1565c0]'
                                      }`}
                                    >
                                      <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-1.5">
                                          <Ticket className="w-3.5 h-3.5 text-[#1565c0] shrink-0" />
                                          <h5 className="font-bold text-xs truncate text-slate-800">{v.name}</h5>
                                        </div>
                                        <div className="flex items-center gap-2 mt-0.5">
                                          <span className="text-[10px] font-mono text-slate-400">
                                            {v.code ? `KODE: ${v.code}` : 'VOUCHER MEMBER'}
                                          </span>
                                          <span className="text-[11px] font-black text-[#1565c0]">
                                            {v.type === 'percent'
                                              ? `Diskon ${v.discountPercent}%`
                                              : `Potongan Rp ${(v.discountAmount || 15000).toLocaleString('id-ID')}`}
                                          </span>
                                        </div>
                                      </div>
                                      <button
                                        type="button"
                                        onClick={() => {
                                          if (isCurrentSelected) {
                                            setSelectedVoucher(null);
                                            showToast('Voucher dilepas.');
                                          } else {
                                            setSelectedVoucher(v);
                                            setShowVoucherSelector(false);
                                            showToast(`Voucher "${v.name}" dipasang!`);
                                          }
                                        }}
                                        className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shrink-0 ${
                                          isCurrentSelected
                                            ? 'bg-rose-500 text-white'
                                            : 'bg-[#1565c0] text-white hover:bg-blue-700 shadow'
                                        }`}
                                      >
                                        {isCurrentSelected ? 'Lepas' : 'Gunakan'}
                                      </button>
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      <div className="p-4 bg-slate-50 rounded-2xl border space-y-2">
                        <span className="text-xs font-bold uppercase text-slate-500 block mb-1">Rincian Harga</span>
                        <div className="flex justify-between text-xs"><span className="text-slate-500">Subtotal</span><span className="font-bold">Rp {subtotalCart.toLocaleString('id-ID')}</span></div>
                        {discountAmount > 0 && <div className="flex justify-between text-xs text-[#1565c0] font-bold"><span>Diskon ({selectedVoucher?.name})</span><span>-Rp {discountAmount.toLocaleString('id-ID')}</span></div>}
                        <div className="border-t pt-2 flex justify-between items-center"><span className="text-xs font-bold">Total Bayar</span><span className="text-xl font-black text-[#1565c0]">Rp {finalTotalAmount.toLocaleString('id-ID')}</span></div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="p-4 border-t space-y-2">
                    {checkoutStep === 'cart' ? (
                      <button onClick={() => setCheckoutStep('payment')} className="w-full bg-[#1565c0] text-white py-3.5 rounded-xl font-bold text-sm shadow">Lanjut ke Pembayaran</button>
                    ) : (
                      <button onClick={handleProcessCheckout} className="w-full bg-sky-500 text-white py-3.5 rounded-xl font-extrabold text-sm shadow">
                        {deliveryMethod === 'Diantar' ? 'Konfirmasi Pesanan (Diantar)' : 'Konfirmasi Pesanan (Ambil di Kasir)'}
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL POPUP PILIH DIANTAR ATAU AMBIL DI KASIR */}
          {isDeliveryModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-4 shadow-2xl relative">
                <button
                  type="button"
                  onClick={() => { setIsDeliveryModalOpen(false); setPendingProductAction(false); }}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="text-center space-y-1">
                  <div className="w-12 h-12 rounded-2xl bg-blue-50 text-[#1565c0] mx-auto flex items-center justify-center text-2xl shadow-inner">
                    🛵
                  </div>
                  <h3 className="font-extrabold text-base text-slate-800">Pilih Layanan Pesanan</h3>
                  <p className="text-xs text-slate-500">Pesanan Anda ingin diantar atau diambil langsung di kasir?</p>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-1">
                  <button
                    type="button"
                    onClick={() => setDeliveryMethod('Diantar')}
                    className={`p-4 rounded-2xl border-2 text-center transition flex flex-col items-center gap-1.5 ${
                      deliveryMethod === 'Diantar'
                        ? 'border-[#1565c0] bg-blue-50 text-[#1565c0] shadow-sm'
                        : 'border-slate-200 bg-white text-slate-700 hover:border-blue-300'
                    }`}
                  >
                    <span className="text-2xl">🛵</span>
                    <span className="font-extrabold text-xs">Diantar</span>
                    <span className="text-[10px] text-slate-400">Antar ke lokasi</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => setDeliveryMethod('Ambil di Kasir')}
                    className={`p-4 rounded-2xl border-2 text-center transition flex flex-col items-center gap-1.5 ${
                      deliveryMethod === 'Ambil di Kasir'
                        ? 'border-[#1565c0] bg-blue-50 text-[#1565c0] shadow-sm'
                        : 'border-slate-200 bg-white text-slate-700 hover:border-blue-300'
                    }`}
                  >
                    <span className="text-2xl">🏪</span>
                    <span className="font-extrabold text-xs">Ambil di Kasir</span>
                    <span className="text-[10px] text-slate-400">Jemput di kedai</span>
                  </button>
                </div>

                {deliveryMethod === 'Diantar' && (
                  <div className="space-y-1.5 pt-1">
                    <label className="text-[11px] font-bold text-slate-600 block">Alamat / Lokasi Pengantaran *</label>
                    <textarea
                      rows={2}
                      value={deliveryAddress}
                      onChange={(e) => setDeliveryAddress(e.target.value)}
                      placeholder="Contoh: Jl. Merdeka No. 12 / Depan Indomaret..."
                      className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs outline-none focus:ring-2 focus:ring-[#1565c0]"
                    />
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => {
                    if (!deliveryMethod) {
                      showToast('Pilih Diantar atau Ambil di Kasir terlebih dahulu!', 'error');
                      return;
                    }
                    if (deliveryMethod === 'Diantar' && !deliveryAddress.trim()) {
                      showToast('Masukkan alamat/lokasi pengantaran terlebih dahulu!', 'error');
                      return;
                    }
                    setIsDeliveryModalOpen(false);
                    if (pendingProductAction) {
                      setPendingProductAction(false);
                      executeAddToCart(deliveryMethod);
                    } else {
                      showToast(`Layanan diubah ke: ${deliveryMethod === 'Diantar' ? 'ANTAR' : 'JEMPUT'}`);
                    }
                  }}
                  className="w-full bg-[#1565c0] hover:bg-blue-700 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition"
                >
                  {pendingProductAction ? 'Simpan & Tambah ke Keranjang' : 'Simpan Pilihan Layanan'}
                </button>
              </div>
            </div>
          )}

          {/* MODAL 9: SCAN / INPUT KODE QR STRUK MANUAL */}
          {qrModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border rounded-3xl max-w-sm w-full p-6 space-y-4 text-center shadow-2xl relative">
                <button onClick={() => setQrModalOpen(false)} className="absolute top-4 right-4 text-slate-400"><X className="w-5 h-5" /></button>
                <QrCode className="w-10 h-10 text-[#1565c0] mx-auto" />
                <h3 className="font-bold text-lg">Scan / Input Kode QR Struk</h3>
                <p className="text-xs text-slate-500">Ketikkan kode QR unik dari struk belanja Anda untuk menambah poin.</p>
                <input type="text" value={scanQRInput} onChange={(e) => setScanQRInput(e.target.value)} placeholder="QR-POINT-RS-123456..." className="w-full bg-slate-50 border p-3 rounded-xl text-xs font-mono outline-none" />
                <button onClick={() => handleClaimQR()} className="w-full bg-[#1565c0] text-white font-bold py-3 rounded-xl shadow text-xs">Proses Klaim Poin</button>
              </div>
            </div>
          )}

          {/* MODAL 10: ADMIN EDIT KODE PROMO */}
          {adminPromoModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const code = fd.get('code').trim().toUpperCase();
                const type = fd.get('type');
                const val = Number(fd.get('val')) || 0;

                const promoData = {
                  id: adminPromoModal.item ? adminPromoModal.item.id : `p_${Date.now()}`,
                  title: fd.get('title'),
                  code: code,
                  type: type,
                  discountPercent: type === 'percent' ? val : 0,
                  discountAmount: type === 'fixed' ? val : 0
                };

                showToast('Menyimpan ke Google Sheets...');
                await postToDatabase({ action: 'savePromo', promo: promoData });
                fetchPromosFromSpreadsheet();
                setAdminPromoModal({ open: false, item: null });
                showToast('Kode Promo berhasil disimpan!');
              }} className="bg-white border border-slate-200 rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base">{adminPromoModal.item ? 'Edit Kode Promo' : 'Tambah Kode Promo Baru'}</h3>
                  <button type="button" onClick={() => setAdminPromoModal({ open: false, item: null })} className="text-slate-400"><X className="w-5 h-5" /></button>
                </div>
                
                <div>
                  <label className="text-[11px] font-bold block mb-1">Judul Promo</label>
                  <input name="title" defaultValue={adminPromoModal.item?.title || ''} placeholder="Contoh: Diskon Kopi 20%" required className="w-full p-2.5 rounded-xl border text-xs bg-white outline-none" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Kode Promo</label>
                    <input name="code" defaultValue={adminPromoModal.item?.code || ''} placeholder="GOLD20" required className="w-full p-2.5 rounded-xl border text-xs font-mono uppercase bg-white outline-none" />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1">Tipe Diskon</label>
                    <select name="type" defaultValue={adminPromoModal.item?.type || 'fixed'} className="w-full p-2.5 rounded-xl border text-xs bg-white outline-none">
                      <option value="fixed">Nominal (Rp)</option>
                      <option value="percent">Persentase (%)</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1">Nilai Potongan (Rp atau %)</label>
                  <input name="val" type="number" defaultValue={adminPromoModal.item?.discountAmount || adminPromoModal.item?.discountPercent || 10000} required className="w-full p-2.5 rounded-xl border text-xs bg-white outline-none" />
                </div>

                <button type="submit" className="w-full bg-[#1565c0] text-white py-3 rounded-xl font-bold text-xs shadow">Simpan Kode Promo</button>
              </form>
            </div>
          )}

          {/* MODAL 11: PIN KEAMANAN MENU KASIR (KODE: 1122) */}
          {isPinModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl max-w-xs w-full p-6 space-y-4 shadow-2xl text-center">
                
                <div className="flex justify-between items-center pb-1">
                  <div className="w-10 h-10 rounded-2xl bg-blue-500/10 text-[#1565c0] flex items-center justify-center mx-auto mb-1">
                    <Lock className="w-6 h-6" />
                  </div>
                  <button onClick={() => setIsPinModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div>
                  <h3 className="text-base font-extrabold text-slate-800">PIN Keamanan Kasir</h3>
                  <p className="text-[11px] text-slate-400 mt-1">Akses khusus kasir & owner. Masukkan 4 digit PIN.</p>
                </div>

                <div className="flex justify-center items-center gap-3 py-2">
                  {[0, 1, 2, 3].map(i => (
                    <div 
                      key={i} 
                      className={`w-4 h-4 rounded-full border-2 transition-all ${pinInput.length > i ? 'bg-[#1565c0] border-[#1565c0] scale-110' : 'border-slate-300 bg-transparent'}`}
                    />
                  ))}
                </div>

                {pinError && (
                  <p className="text-xs text-rose-500 font-bold animate-pulse">{pinError}</p>
                )}

                <div className="grid grid-cols-3 gap-2 pt-2">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => {
                        if (pinInput.length < 4) {
                          const nextPin = pinInput + num;
                          setPinInput(nextPin);
                          setPinError('');
                          if (nextPin.length === 4) handleVerifyPin(nextPin);
                        }
                      }}
                      className="h-12 rounded-2xl bg-slate-100 text-slate-800 font-extrabold text-base active:bg-[#1565c0] active:text-white transition shadow-sm"
                    >
                      {num}
                    </button>
                  ))}

                  <button
                    type="button"
                    onClick={() => { setPinInput(''); setPinError(''); }}
                    className="h-12 rounded-2xl bg-slate-200 text-slate-600 font-bold text-xs"
                  >
                    Hapus
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      if (pinInput.length < 4) {
                        const nextPin = pinInput + '0';
                        setPinInput(nextPin);
                        setPinError('');
                        if (nextPin.length === 4) handleVerifyPin(nextPin);
                      }
                    }}
                    className="h-12 rounded-2xl bg-slate-100 text-slate-800 font-extrabold text-base active:bg-[#1565c0] active:text-white transition shadow-sm"
                  >
                    0
                  </button>

                  <button
                    type="button"
                    onClick={() => handleVerifyPin()}
                    className="h-12 rounded-2xl bg-[#1565c0] text-white font-bold text-xs shadow-md"
                  >
                    Masuk
                  </button>
                </div>

                <p className="text-[10px] text-slate-400 pt-1 font-mono">
                  Default PIN Kasir: <strong>1122</strong>
                </p>

              </div>
            </div>
          )}

          {/* MODAL 12: EDIT & TAMBAH MENU KEDAI */}
          {productModal.open && (
            <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
              <form onSubmit={(e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const editedItem = {
                  id: productModal.item ? productModal.item.id : `m_${Date.now()}`,
                  name: fd.get('name').trim(),
                  category: fd.get('category'),
                  price: Number(fd.get('price')) || 0,
                  stock: Number(fd.get('stock')) || 40,
                  desc: fd.get('desc').trim(),
                  image: fd.get('image').trim() || 'https://images.bukaolshop.com/hosting/38154/08b5850b46db416355.png'
                };
                handleSaveProduct(editedItem);
              }} className="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-6 space-y-3.5 shadow-2xl">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <span>{productModal.item ? '✏️ Edit Menu' : '＋ Tambah Menu Baru'}</span>
                  </h3>
                  <button type="button" onClick={() => setProductModal({ open: false, item: null })} className="text-slate-400">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Nama Menu *</label>
                  <input 
                    name="name" 
                    defaultValue={productModal.item?.name || ''} 
                    required 
                    placeholder="Contoh: Kebab Daging Special" 
                    className="w-full p-2.5 rounded-xl border bg-slate-50 text-xs font-bold outline-none focus:ring-2 focus:ring-[#1565c0]"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Kategori *</label>
                    <select 
                      name="category" 
                      defaultValue={productModal.item?.category || 'Coffee'} 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 text-xs font-bold outline-none"
                    >
                      <option value="Coffee">Coffee</option>
                      <option value="Signature">Signature</option>
                      <option value="Non Coffee">Non Coffee</option>
                      <option value="Fresh Drink">Fresh Drink</option>
                      <option value="Cemilan">Cemilan (Makanan)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Harga Jual (Rp) *</label>
                    <input 
                      name="price" 
                      type="number" 
                      defaultValue={productModal.item?.price || 15000} 
                      required 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 text-xs font-mono font-bold outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Stok / Porsi</label>
                    <input 
                      name="stock" 
                      type="number" 
                      defaultValue={productModal.item?.stock !== undefined ? productModal.item.stock : 50} 
                      required 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 text-xs font-mono font-bold outline-none"
                    />
                  </div>
                  <div>
                    <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Link URL Foto</label>
                    <input 
                      name="image" 
                      type="url" 
                      defaultValue={productModal.item?.image || ''} 
                      placeholder="https://..." 
                      className="w-full p-2.5 rounded-xl border bg-slate-50 text-[11px] outline-none"
                    />
                  </div>
                </div>

                <div>
                  <label className="text-[11px] font-bold block mb-1 text-slate-500 uppercase">Deskripsi Singkat</label>
                  <textarea 
                    name="desc" 
                    rows={2} 
                    defaultValue={productModal.item?.desc || ''} 
                    placeholder="Racikan bahan pilihan..." 
                    className="w-full p-2.5 rounded-xl border bg-slate-50 text-xs outline-none"
                  />
                </div>

                <div className="flex gap-2 pt-2 border-t border-slate-100">
                  {productModal.item && (
                    <button 
                      type="button" 
                      onClick={() => handleDeleteProduct(productModal.item.id)}
                      className="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-3 rounded-xl font-bold text-xs shadow"
                    >
                      Hapus
                    </button>
                  )}
                  <button 
                    type="submit" 
                    className="flex-1 bg-[#1565c0] hover:bg-blue-700 text-white py-3 rounded-xl font-black text-xs shadow-lg"
                  >
                    {productModal.item ? 'Simpan Perubahan Menu' : '+ Tambahkan ke Menu'}
                  </button>
                </div>
              </form>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
